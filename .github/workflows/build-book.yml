name: Build LaTeX book

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lightweight TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            texlive-lang-english \
            texlive-xetex \
            ghostscript \
            poppler-utils

      - name: Build book
        run: |
          echo "Building book..."
          pdflatex -interaction=nonstopmode book.tex
          bibtex book || true
          pdflatex -interaction=nonstopmode book.tex
          pdflatex -interaction=nonstopmode book.tex
          cp book.pdf docs/
          echo "Cleaning up auxiliary files..."
          rm -f book.aux book.bbl book.blg book.log book.out book.toc
          
      - name: Verify PDF
        run: |
          if [ ! -f docs/book.pdf ]; then
            echo "No PDF produced!"
            exit 1
          elif ! pdfinfo docs/book.pdf >/dev/null 2>&1; then
            echo "PDF seems corrupted!"
            exit 1
          fi
          echo "docs/book.pdf built successfully."

      - name: Commit and push PDF
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/book.pdf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update book.pdf [skip ci]" && git push)

      # - name: Upload artifact
      #   if: success()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: book
      #     path: book.pdf

      - name: Prep dir
        run: |
          mkdir -p _site
          cp docs/book.pdf _site/book.pdf

      - name: Setup redirect
        run: |
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=book.pdf"></head></html>' > ./_site/index.html

      - name: Upload to github page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-pdf
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4